[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askdb"
version = "0.2.0"
description = "AskDB: a natural-language data analyst agent (EECS 3311 course project)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krishi Rajeshkumar Shah" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "PySide6>=6.7",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
askdb = "askdb.presentation.cli.app:main"
askdb-gui = "askdb.presentation.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]
